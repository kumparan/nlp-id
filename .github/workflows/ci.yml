name: python

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Setup uv and Python
    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true
        python-version: '3.12'

    # 2. Synchronize project
    - name: Install dependencies
      run: |
        uv sync
        uv run python -m nltk.downloader punkt_tab

    # 3. Check for security vulnerabilities using pip-audit via uvx
    - name: Vulnerabilities checker
      run: |
        uv pip compile pyproject.toml -o requirements.txt
        uvx pip-audit -r requirements.txt

    # 4. Build the package
    - name: Build package
      run: |
        uv build

    # 5. Verify the generated dist directory
    - name: Verify dist directory
      run: |
        ls -l dist

    # 6. Install the newly built package into the environment
    - name: Install built package
      run: |
        uv pip install dist/*.whl

    # 7. Run the test suite
    - name: Run tests
      run: |
        uv run make test
