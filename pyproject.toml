[tool.poetry]
name = "nlp-id"
version = "0.1.23.0"
description = "kumparan's NLP Services"
authors = ["Zavli Juwantara <zavli.juwantara@kumparan.com>"]
repository = "https://github.com/kumparan/NLP-ID"
maintainers = [
    "Frandy Eddy <eddy.frandy@gmail.com>",
    "Dhanang Hadhi Sasmita <dhananghadhi@gmail.com>",
    "Aslam Hadi H<aslam.hadi@kumparan.com>",
    "Ghefira Nur Fatimah Widyasari<ghefira.fatimah@kumparan.com>"
]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
scikit-learn = "1.8.0"
nltk = "3.10.3"
wget = "3.2"
huggingface-hub = "1.14.0"
scipy = "1.17.1"
numpy = "2.4.4"


[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pip-audit = "2.10.0"
black = "26.3.1"
isort = "8.0.1"


[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
