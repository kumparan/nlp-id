[project]
name = "nlp-id"
version = "0.1.22.0"
description = "kumparan's NLP Services"
authors = [{ name = "Zavli Juwantara", email = "zavli.juwantara@kumparan.com" }]
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = "MIT"
maintainers = [
    { name = "Frandy Eddy", email = "eddy.frandy@gmail.com" },
    { name = "Dhanang Hadhi Sasmita", email = "dhananghadhi@gmail.com" },
    { name = "Aslam Hadi H", email = "aslam.hadi@kumparan.com" },
    { name = "Ghefira Nur Fatimah Widyasari", email = "ghefira.fatimah@kumparan.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "scikit-learn==1.8.0",
    "nltk==3.9.4",
    "wget==3.2",
    "huggingface-hub==1.14.0",
    "scipy==1.17.1",
    "numpy==2.4.4",
]

[project.urls]
Repository = "https://github.com/kumparan/NLP-ID"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pip-audit==2.10.0",
    "black==26.3.1",
    "isort==8.0.1",
]

[tool.uv]
default-groups = "all"
package = true

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
